name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show SDK
        run: xcrun --sdk iphoneos --show-sdk-path

      - name: Build cheat.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 -miphoneos-version-min=13.0 \
            -isysroot "$SDK" -O2 -fvisibility=hidden -s \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -lobjc -o cheat.dylib \
            esp.mm menu.mm hook.mm dyld_hide.mm fishhook.c
          strip -x cheat.dylib
          file cheat.dylib
          ls -lh cheat.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cheat-build
          path: cheat.dylib
