name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build dylib
        run: |
          set -e
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ARCH="-arch arm64 -arch arm64e"
          MIN="-miphoneos-version-min=14.0"
          CXXFLAGS="-std=c++17 -fno-exceptions -fno-rtti -fvisibility=hidden"
          OBJCFLAGS="-fobjc-arc -fmodules"

          mkdir -p build

          for f in esp hook menu dyld_hide; do
            xcrun -sdk iphoneos clang++ $ARCH $MIN -isysroot "$SDK" \
              $CXXFLAGS $OBJCFLAGS -I. -c "$f.mm" -o "build/$f.o"
          done

          xcrun -sdk iphoneos clang $ARCH $MIN -isysroot "$SDK" \
            -std=c11 -fvisibility=hidden -I. -c fishhook.c -o build/fishhook.o

          xcrun -sdk iphoneos clang++ $ARCH $MIN -isysroot "$SDK" \
            -dynamiclib \
            -framework Foundation -framework UIKit -framework CoreGraphics \
            -Wl,-install_name,@executable_path/cheat.dylib \
            build/esp.o build/hook.o build/menu.o \
            build/dyld_hide.o build/fishhook.o \
            -o build/cheat.dylib

          codesign -s - --force --deep build/cheat.dylib || true
          
      - uses: actions/upload-artifact@v4
        with:
          name: cheat-dylib
          path: build/cheat.dylib
