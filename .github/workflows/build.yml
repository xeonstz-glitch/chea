name: build
on: [push, workflow_dispatch]

jobs:
  dylib:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build cheat.dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -dynamiclib -arch arm64 -isysroot "$SDK" -O2 -s \
            -framework Foundation -framework UIKit \
            -lobjc -o cheat.dylib \
            esp.mm menu.mm hook.mm dyld_hide.mm fishhook.c
          strip -x cheat.dylib

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cheat-build
          path: cheat.dylib
